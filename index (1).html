<script>
const W=940,H=640,$=s=>document.querySelector(s);
document.querySelectorAll('.track').forEach(t=>t.innerHTML=$('#tpl').innerHTML);
const tracks=[...document.querySelectorAll('.track')],sc=$('#sc'),dev=$('#dev'),L=$('#L'),nm=[$('.nl'),$('.nr')],nav=$('#nav');
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),lerp=(a,b,t)=>a+(b-a)*t,ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,sm=t=>t*t*(3-2*t);
const max=()=>document.documentElement.scrollHeight-innerHeight;
let cur=0,curS=1,cs=0,nb='0px';const R=document.querySelector('.right');
function counters(on){if(on&&!cs)cs=performance.now();if(!on)cs=0;const t=cs?cl((performance.now()-cs)/1600):0,e=1-Math.pow(1-t,3);document.querySelectorAll('.cnt').forEach(n=>n.textContent=Math.round(e*n.dataset.n)+(t?n.dataset.s:''))}
function render(p){
  let u=p<.12?0:p<.3?ease((p-.12)/.18):p<.78?1:p<.92?1-ease((p-.78)/.14):0;
  const k=cl((p-.3)/.48)*4,i=Math.min(4,Math.floor(k)),f=k-i;
  const y=-(i+(i<4?sm(cl((f-.25)/.5)):0))*H;
  tracks.forEach(t=>t.style.transform=`translateY(${y}px)`);
  const sClosed=Math.min(innerWidth*.78/(W/2),innerHeight*.6/H,1.15),sOpen=Math.min(innerWidth*.94/W,innerHeight*.6/H,1.15);
  sc.style.transform=`scale(${lerp(sClosed,sOpen,u)})`;
  dev.style.transform=`translateX(${-(W/4)*(1-u)}px) rotateY(${-Math.sin(u*Math.PI)*9}deg)`;
  L.style.transform=`translateZ(2px) rotateY(${180*(1-u)}deg)`;
  const s=lerp(sClosed,sOpen,u),gap=(1-u)*0+u*Math.max(innerWidth*.5,W*s*.55);
  nm[0].style.transform=`translateX(calc(${nb} + ${-gap}px))`;nm[1].style.transform=`translateX(calc(${nb} + ${gap}px))`;
  nm.forEach(n=>n.style.opacity=1-u*.85);curS=s;const r=lerp(44,6,u);L.style.borderRadius=`44px ${r}px ${r}px 44px`;R.style.borderRadius=`${r}px 44px 44px ${r}px`;counters(u>.9&&Math.min(4,i+(f>.5?1:0))==2&&p<.78);
  $('#lock').style.opacity=p<.5?1:0;$('#call').style.opacity=p<.5?0:1;$('#lock').style.pointerEvents=p<.5?'auto':'none';$('#call').style.pointerEvents=p<.5?'none':'auto';
  nav.style.opacity=u>.9?1:0;nav.style.pointerEvents=u>.9?'auto':'none';
}
function loop(){cur+=((max()>0?scrollY/max():0)-cur)*.09;render(cur);requestAnimationFrame(loop)}
loop();
document.addEventListener('click',e=>{const b=e.target.closest('.sec [data-p]');if(b)scrollTo({top:b.dataset.p*max(),behavior:'smooth'})});
nav.onclick=e=>{const b=e.target.closest('button');if(b)scrollTo({top:b.dataset.p*max(),behavior:'smooth'})};
$('.hint').onclick=()=>scrollTo({top:.3*max(),behavior:'smooth'});
document.querySelector('.modes').onclick=e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('.modes button').forEach(x=>x.classList.toggle('on',x===b));document.body.classList.remove('glow','orbit');if(b.dataset.m!=='basic')document.body.classList.add(b.dataset.m)};
const root=document.documentElement,setT=t=>{root.dataset.theme=t;document.querySelectorAll('#dock button').forEach(b=>b.classList.toggle('on',b.dataset.t===t))};
setT(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
$('#dock').onclick=e=>{const b=e.target.closest('button');if(b)setT(b.dataset.t)};
const sl=$('#slide'),kb=$('#knob');let dr=0,sx=0;
